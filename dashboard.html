<!DOCTYPE html>
<html lang="en">
<head>
<title>Morgan Bank Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/backendless@7.3.4/dist/backendless.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#050A18;color:#fff;padding-bottom:90px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:15px 20px}
.avatar{width:38px;height:38px;border-radius:50%;background:#2563EB;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111827;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #1F2937;z-index:9999}
.nav-item{text-align:center;font-size:11px;color:#6B7280;cursor:pointer;padding:5px 10px}
.nav-item.active{color:#2563EB}
.nav-icon{font-size:22px}
.balance-card{background:linear-gradient(90deg,#2563EB,#1D4ED8);margin:15px 20px;padding:20px;border-radius:16px;position:relative}
.balance-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:#BFDBFE}
.balance-amount{font-size:32px;font-weight:bold}
.add-money{position:absolute;right:15px;bottom:-15px;background:#000;color:#fff;padding:8px 16px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:12px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:15px}
.action-box{background:#111827;padding:20px 10px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid transparent}
.action-box:active{border-color:#2563EB;transform:scale(0.95)}
.last-tx{background:#111827;margin:15px 20px;padding:15px;border-radius:12px;display:flex;justify-content:space-between;cursor:pointer}
.modal{background:#111827;padding:20px;border-radius:16px;margin:15px;border:1px solid #2563EB44;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
input,select,textarea{width:100%;padding:12px;margin:10px 0;background:#1F2937;border:1px solid #2a3447;color:#fff;border-radius:8px}
.btn-primary{width:100%;padding:14px;background:#2563EB;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-secondary{width:100%;padding:12px;background:#1F2937;color:#fff;border:1px solid #374151;border-radius:8px;cursor:pointer;margin-top:10px}
.history-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1F2937}
.loan-card{background:#1F2937;padding:15px;border-radius:12px;margin:10px 0;border-left:4px solid #f59e0b}
.status-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.status-pending{background:#f59e0b22;color:#f59e0b}
.status-approved{background:#22C55E22;color:#22C55E}
.status-rejected{background:#EF444422;color:#EF4444}
</style>
</head>
<body>
<div class="topbar">
  <div class="profile"><div class="avatar" id="avatarText" onclick="document.getElementById('fileInput').click()">U</div><h2 style="margin-left:10px">Hi, <span id="userName">User</span></h2></div>
  <div style="display:flex;gap:15px;font-size:20px"><span onclick="showHistory()">🔔</span><span onclick="showMe()">👤</span></div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadPic(event)">
<div class="balance-card">
  <div class="balance-top"><span>Available Balance</span><span onclick="showHistory()" style="cursor:pointer">History ></span></div>
  <div class="balance-amount" id="balance">$0.00</div>
  <button class="add-money" onclick="showAddMoney()">+ Add Money</button>
</div>
<div class="actions">
  <div class="action-box" onclick="handleAction('toBank')"><div>🏦</div><p>To Bank</p></div>
  <div class="action-box" onclick="handleAction('morganPay')"><div>👤</div><p>MorganPay</p></div>
  <div class="action-box" onclick="handleAction('savings')"><div>🐷</div><p>Savings</p></div>
  <div class="action-box" onclick="handleAction('cards')"><div>💳</div><p>Cards</p></div>
</div>
<div class="last-tx" onclick="showHistory()">
  <div><b>Last Transaction</b><p id="lastTx" style="font-size:12px;color:#9CA3AF">None</p></div>
  <div style="text-align:right"><p id="lastTxDate" style="font-size:12px">Today</p><p id="lastTxTime">--:--</p></div>
</div>
<div id="actionForm"></div>
<div class="bottom-nav">
  <div class="nav-item active" id="navHome" onclick="goHome()"><div class="nav-icon">🏠</div>Home</div>
  <div class="nav-item" id="navLoan" onclick="showLoan()"><div class="nav-icon">💼</div>Loan</div>
  <div class="nav-item" id="navHistory" onclick="showHistory()"><div class="nav-icon">📈</div>History</div>
  <div class="nav-item" id="navMe" onclick="showMe()"><div class="nav-icon">😊</div>Me</div>
</div>
<script>
// DEBUG LOGGER
function log(msg){ console.log(msg); }
window.onerror = function(m,s,l){ console.log('ERROR: '+m); }
Backendless.initApp('65ABB198-A187-4B5A-B7D3-0839AEA80B26', 'CDA94D34-9A3F-46AB-8B13-65193E45A1B0');
let currentUser = JSON.parse(localStorage.getItem('currentUser'));
if(!currentUser){ alert('Please login first'); window.location.href='index.html'; }
let verifiedRecipient=null;
loadDashboard();
async function loadDashboard(){
  try{
    console.log('Loading dashboard');
    let fresh = await Backendless.Data.of("Users").findById(currentUser.objectId);
    if(fresh){ currentUser={...currentUser, ...fresh}; localStorage.setItem('currentUser', JSON.stringify(currentUser)); }
  }catch(e){ console.log(e.message); }
  document.getElementById('userName').innerText=(currentUser.name||'User').split(' ')[0];
  document.getElementById('balance').innerText='$'+(currentUser.balance||0).toFixed(2);
  document.getElementById('avatarText').innerText=(currentUser.name||'U').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  loadLastTx();
}
function handleAction(type){
  
  try{
    if(type==='toBank') showToBank();
    if(type==='morganPay') showMorganPay();
    if(type==='savings') showSavings();
    if(type==='cards') showCards();
  }catch(e){ alert('Action error: '+e.message); log(e.message); }
}
function goHome(){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('navHome').classList.add('active');
  document.getElementById('actionForm').innerHTML='';
  
}
function setActive(id){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  let el=document.getElementById(id); if(el) el.classList.add('active');
}
// ===== HISTORY - SIMPLIFIED & ROBUST =====
async function showHistory(){
  
  setActive('navHistory');
  try{
    let q = new Backendless.DataQuery(); 
    q.whereClause = `userId = '${currentUser.objectId}'`;
    q.sortBy=['created DESC'];
    q.pageSize=50;
    let txs = await Backendless.Data.of('Transactions').find(q);
    
    let html=`<div class="modal"><h3>Transaction History</h3><p style="color:#9CA3AF;font-size:12px">Total: ${txs.length}</p>`;
    if(txs.length===0) html+=`<p style="margin:15px 0">No transactions yet</p>`;
    else txs.forEach(t=>{
      let d = t.created ? new Date(t.created).toLocaleString() : (t.date ? new Date(t.date).toLocaleString() : 'recent');
      html+=`<div class="history-item"><div><b>${t.type||'Transaction'}</b><p style="font-size:11px;color:#9CA3AF">${d}</p></div><div style="color:${(t.amount||0)>0?'#22C55E':'#EF4444'}">${(t.amount||0)>0?'+':''}$${Math.abs(t.amount||0).toFixed(2)}</div></div>`;
    });
    html+=`<button class="btn-secondary" onclick="closeModal()">Close</button></div>`;
    document.getElementById('actionForm').innerHTML=html;
    window.scrollTo(0, document.body.scrollHeight);
  }catch(e){
    
    alert('History failed: '+e.message+'\n\nMake sure Transactions table exists and has userId column');
    document.getElementById('actionForm').innerHTML=`<div class="modal"><h3>History Error</h3><p style="color:#EF4444">${e.message}</p><p style="font-size:12px;color:#aaa">Create Transactions table in Backendless if missing</p><button class="btn-secondary" onclick="closeModal()">Close</button></div>`;
  }
}
// ===== LOAN - WORKS EVEN WITHOUT TABLE (local fallback) =====
async function showLoan(){
  
  setActive('navLoan');
  try{
    let loans=[];
    try{
      let q=new Backendless.DataQuery(); q.whereClause=`userId='${currentUser.objectId}'`; q.sortBy=['created DESC']; q.pageSize=20;
      loans = await Backendless.Data.of('Loans').find(q);
      
    }catch(e){
      
      loans = JSON.parse(localStorage.getItem('myLoans')||'[]');
    }
    let pending = loans.find(l=>l.status==='pending');
    let lastRejected = loans.filter(l=>l.status==='rejected').sort((a,b)=> new Date(b.reviewedAt||b.created)-new Date(a.reviewedAt||a.created))[0];
    let canApply=true; let blockMsg='';
    if(lastRejected){
      let daysSince=(Date.now()-new Date(lastRejected.reviewedAt||lastRejected.created).getTime())/(1000*60*60*24);
      if(daysSince<14){ canApply=false; blockMsg=`You didn't meet the requirements. Please try again in ${Math.ceil(14-daysSince)} days.`; }
    }
    let html=`<div class="modal"><h3>Loan Center</h3>`;
    if(loans.length>0){
      html+=`<div style="margin:15px 0">`;
      loans.forEach(l=>{
        html+=`<div class="loan-card"><div style="display:flex;justify-content:space-between"><b>$${l.amount} - ${l.purpose}</b><span class="status-badge status-${l.status}">${(l.status||'pending').toUpperCase()}</span></div><p style="font-size:12px;color:#9CA3AF;margin-top:6px">${l.created?new Date(l.created).toLocaleString():''} | ${l.duration||''}</p>
        ${l.status==='pending'?`<p style="color:#f59e0b;font-size:13px;margin-top:8px">⏳ Bank is reviewing your eligibility...</p>`:''}
        ${l.status==='approved'?`<p style="color:#22C55E;font-size:13px;margin-top:8px">✅ Confirmed! $${l.amount} credited on ${l.reviewedAt?new Date(l.reviewedAt).toLocaleString():''}</p>`:''}
        ${l.status==='rejected'?`<p style="color:#EF4444;font-size:13px;margin-top:8px">❌ You didn't meet the requirements. Please try again in 14 days.</p>`:''}
        </div>`;
      });
      html+=`</div>`;
    }
    if(pending){
      html+=`<div style="background:#f59e0b22;border:1px solid #f59e0b;padding:15px;border-radius:12px;text-align:center"><h4>⏳ Under Review</h4><p style="font-size:13px;margin-top:8px">Bank is reviewing $${pending.amount}. Wait for admin.</p></div>`;
    }else if(!canApply){
      html+=`<div style="background:#EF444422;border:1px solid #EF4444;padding:15px;border-radius:12px;text-align:center"><h4>🚫 Blocked</h4><p style="font-size:13px;margin-top:8px">${blockMsg}</p></div>`;
    }else{
      html+=`<div style="background:#1F2937;padding:15px;border-radius:12px;margin-top:15px"><h4>Request New Loan</h4>
      <input id="loanAmount" type="number" placeholder="Amount e.g 5000"><select id="loanPurpose"><option value="">Purpose</option><option>Business</option><option>Emergency</option><option>Education</option><option>Medical</option></select><select id="loanDuration"><option>30 days</option><option>60 days</option><option>90 days</option></select><textarea id="loanDesc" placeholder="Reason" rows="2"></textarea><button class="btn-primary" onclick="submitLoan()">Submit Request</button></div>`;
    }
    html+=`<button class="btn-secondary" onclick="closeModal()">Close</button></div>`;
    document.getElementById('actionForm').innerHTML=html;
    window.scrollTo(0, document.body.scrollHeight);
  }catch(e){  alert('Loan error: '+e.message); }
}
async function submitLoan(){
  try{
    let amount=parseFloat(document.getElementById('loanAmount').value);
    let purpose=document.getElementById('loanPurpose').value;
    let duration=document.getElementById('loanDuration').value;
    let desc=document.getElementById('loanDesc').value;
    if(!amount||amount<=0) return alert('Enter amount');
    if(!purpose) return alert('Select purpose');
    // Check pending
    try{
      let q=new Backendless.DataQuery(); q.whereClause=`userId='${currentUser.objectId}' AND status='pending'`; let c=await Backendless.Data.of('Loans').getObjectCount(q);
      if(c>0) return alert('You have pending loan under review');
    }catch(e){}
    let loan={userId:currentUser.objectId, userName:currentUser.name, userEmail:currentUser.email, accountNumber:currentUser.accountNumber, amount:amount, purpose:purpose, duration:duration, description:desc, status:'pending', site:'morganbank', created:new Date(), reviewedAt:null};
    try{
      await Backendless.Data.of('Loans').save(loan);
      
    }catch(e){
      
      let localLoans=JSON.parse(localStorage.getItem('myLoans')||'[]');
      loan.objectId='local_'+Date.now();
      localLoans.unshift(loan);
      localStorage.setItem('myLoans', JSON.stringify(localLoans));
    }
    document.getElementById('actionForm').innerHTML=`<div class="modal" style="text-align:center"><h3>📋 Submitted</h3><div style="font-size:50px;margin:20px 0">⏳</div><p><b>Bank is reviewing your eligibility</b></p><p style="color:#9CA3AF;font-size:13px;margin-top:10px">Amount: $${amount.toFixed(2)}<br>Admin will approve soon</p><button class="btn-primary" onclick="showLoan()">View Status</button></div>`;
  }catch(e){ alert('Submit failed: '+e.message); log(e.message); }
}
// ===== ME =====
function showMe(){
  
  setActive('navMe');
  try{
    let html=`<div class="modal" style="text-align:center"><div style="width:70px;height:70px;border-radius:50%;background:#2563EB;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 10px">${(currentUser.name||'U').slice(0,2).toUpperCase()}</div><h3>${currentUser.name||''}</h3><p style="color:#9CA3AF">${currentUser.email||''}</p><p style="color:#9CA3AF;font-size:12px;margin-top:5px">${currentUser.accountNumber||''}</p><div style="background:#1F2937;padding:15px;border-radius:12px;margin:20px 0;text-align:left"><p style="display:flex;justify-content:space-between"><span>Balance</span><b>$${(currentUser.balance||0).toFixed(2)}</b></p><p style="display:flex;justify-content:space-between;margin-top:8px"><span>Savings</span><b>$${(currentUser.savings||0).toFixed(2)}</b></p></div><button class="btn-primary" onclick="showLoan()">My Loans</button><button class="btn-secondary" onclick="showHistory()">History</button><button class="btn-secondary" onclick="logout()">Logout</button></div>`;
    document.getElementById('actionForm').innerHTML=html;
  }catch(e){ alert('Me error: '+e.message); }
}
// ===== OTHER ACTIONS =====
function showToBank(){
  let html=`<div class="modal"><h3>Transfer To Bank</h3><input id="transferAccount" placeholder="Account Number e.g MB123456"><input id="accountName" placeholder="Name" disabled><input id="transferAmount" type="number" placeholder="Amount"><button class="btn-secondary" onclick="verifyAccount()">Verify Account</button><button class="btn-primary" onclick="doTransfer()">Transfer</button><button class="btn-secondary" onclick="closeModal()">Close</button><p id="transferMsg" style="margin-top:10px"></p></div>`;
  document.getElementById('actionForm').innerHTML=html;
}
async function verifyAccount(){
  let acc=document.getElementById('transferAccount').value.trim(); if(!acc) return alert('Enter account');
  document.getElementById('transferMsg').innerHTML='Verifying...';
  try{
    let q=new Backendless.DataQuery(); q.whereClause=`accountNumber='${acc}'`; let users=await Backendless.Data.of("Users").find(q);
    if(users.length==0){ document.getElementById('transferMsg').innerHTML='<span style="color:#EF4444">Not found</span>'; verifiedRecipient=null; }
    else{ verifiedRecipient=users[0]; document.getElementById('accountName').value=verifiedRecipient.name; document.getElementById('transferMsg').innerHTML='<span style="color:#22C55E">✓ '+verifiedRecipient.name+'</span>'; }
  }catch(e){ document.getElementById('transferMsg').innerHTML='Error: '+e.message; }
}
async function doTransfer(){
  let amount=parseFloat(document.getElementById('transferAmount').value); if(!verifiedRecipient) return alert('Verify first'); if(!amount||amount<=0) return alert('Invalid'); if((currentUser.balance||0)<amount) return alert('Insufficient balance');
  try{
    currentUser.balance-=amount; await Backendless.Data.of("Users").save(currentUser);
    verifiedRecipient.balance=(verifiedRecipient.balance||0)+amount; await Backendless.Data.of("Users").save(verifiedRecipient);
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    await Backendless.Data.of('Transactions').save({type:`Transfer to ${verifiedRecipient.name}`, amount:-amount, userId:currentUser.objectId, site:'morganbank', created:new Date(), date:new Date()});
    await Backendless.Data.of('Transactions').save({type:`Transfer from ${currentUser.name}`, amount:amount, userId:verifiedRecipient.objectId, site:'morganbank', created:new Date(), date:new Date()});
    document.getElementById('balance').innerText='$'+currentUser.balance.toFixed(2);
    alert('Transferred $'+amount.toFixed(2)); closeModal(); loadLastTx();
  }catch(e){ alert('Transfer failed: '+e.message); }
}
function showAddMoney(){ document.getElementById('actionForm').innerHTML=`<div class="modal"><h3>Add Money (Demo)</h3><input id="addAmount" type="number" placeholder="Amount"><button class="btn-primary" onclick="doAddMoney()">Credit</button><button class="btn-secondary" onclick="closeModal()">Close</button></div>`; }
async function doAddMoney(){ let amt=parseFloat(document.getElementById('addAmount').value); if(!amt) return; currentUser.balance=(currentUser.balance||0)+amt; await Backendless.Data.of("Users").save(currentUser); localStorage.setItem('currentUser', JSON.stringify(currentUser)); await Backendless.Data.of('Transactions').save({type:'Deposit', amount:amt, userId:currentUser.objectId, site:'morganbank', created:new Date(), date:new Date()}); document.getElementById('balance').innerText='$'+currentUser.balance.toFixed(2); closeModal(); loadLastTx(); }
function showMorganPay(){ document.getElementById('actionForm').innerHTML=`<div class="modal"><h3>MorganPay</h3><p style="color:#aaa;font-size:13px">Send via email (same as To Bank but using email)</p><input id="mpEmail" placeholder="Recipient Email"><input id="mpAmount" type="number" placeholder="Amount"><button class="btn-primary" onclick="doMorganPay()">Send</button><button class="btn-secondary" onclick="closeModal()">Close</button><p id="mpMsg"></p></div>`; }
async function doMorganPay(){
  let email=document.getElementById('mpEmail').value.trim(); let amt=parseFloat(document.getElementById('mpAmount').value);
  if(!email||!amt) return alert('Fill'); if((currentUser.balance||0)<amt) return alert('Insufficient');
  let q=new Backendless.DataQuery(); q.whereClause=`email='${email}'`; let users=await Backendless.Data.of("Users").find(q);
  if(users.length==0) return document.getElementById('mpMsg').innerHTML='<span style="color:#EF4444">User not found</span>';
  let r=users[0]; currentUser.balance-=amt; await Backendless.Data.of("Users").save(currentUser); r.balance=(r.balance||0)+amt; await Backendless.Data.of("Users").save(r);
  localStorage.setItem('currentUser', JSON.stringify(currentUser));
  await Backendless.Data.of('Transactions').save({type:`MorganPay to ${r.name}`, amount:-amt, userId:currentUser.objectId, site:'morganbank', created:new Date(), date:new Date()});
  document.getElementById('balance').innerText='$'+currentUser.balance.toFixed(2); alert('Sent'); closeModal();
}
function showSavings(){ document.getElementById('actionForm').innerHTML=`<div class="modal"><h3>Savings</h3><p>Balance $${(currentUser.balance||0).toFixed(2)} | Savings $${(currentUser.savings||0).toFixed(2)}</p><input id="savAmount" type="number" placeholder="Amount"><button class="btn-primary" onclick="doSave()">Save</button><button class="btn-secondary" onclick="doUnsave()">Withdraw</button><button class="btn-secondary" onclick="closeModal()">Close</button></div>`; }
async function doSave(){ let amt=parseFloat(document.getElementById('savAmount').value); if(!amt||(currentUser.balance||0)<amt) return alert('Invalid'); currentUser.balance-=amt; currentUser.savings=(currentUser.savings||0)+amt; await Backendless.Data.of("Users").save(currentUser); localStorage.setItem('currentUser', JSON.stringify(currentUser)); document.getElementById('balance').innerText='$'+currentUser.balance.toFixed(2); closeModal(); }
async function doUnsave(){ let amt=parseFloat(document.getElementById('savAmount').value); if(!amt||(currentUser.savings||0)<amt) return alert('Invalid'); currentUser.savings-=amt; currentUser.balance=(currentUser.balance||0)+amt; await Backendless.Data.of("Users").save(currentUser); localStorage.setItem('currentUser', JSON.stringify(currentUser)); document.getElementById('balance').innerText='$'+currentUser.balance.toFixed(2); closeModal(); }
function showCards(){ document.getElementById('actionForm').innerHTML=`<div class="modal"><h3>My Card</h3><div style="background:linear-gradient(135deg,#2563EB,#7C3AED);padding:20px;border-radius:12px;margin:15px 0"><p>${currentUser.accountNumber||''}</p><p>${currentUser.name||''}</p><p>Balance $${(currentUser.balance||0).toFixed(2)}</p></div><button class="btn-secondary" onclick="closeModal()">Close</button></div>`; }
async function loadLastTx(){
  try{
    let q=new Backendless.DataQuery(); q.whereClause=`userId='${currentUser.objectId}'`; q.sortBy=['created DESC']; q.pageSize=1;
    let txs=await Backendless.Data.of('Transactions').find(q);
    if(txs.length>0){ document.getElementById('lastTx').innerText= (txs[0].amount>0?'+':'-')+'$'+Math.abs(txs[0].amount).toFixed(2)+' '+txs[0].type; document.getElementById('lastTxTime').innerText=new Date(txs[0].created||txs[0].date).toLocaleTimeString().slice(0,5); }
  }catch(e){  }
}
function closeModal(){ document.getElementById('actionForm').innerHTML=''; }
async function logout(){ await Backendless.UserService.logout(); localStorage.removeItem('currentUser'); window.location.href='index.html'; }
function uploadPic(e){ /* same */ }
</script>
</body>
</html>
